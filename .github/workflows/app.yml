name: app

on:
  pull_request:
    paths:
      - "app/**"
      - "traces/**"
      - "fixtures/**"
      - "contracts/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  android:
    name: android unit tests and trace replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The React Native Gradle plugin resolves from app/node_modules.
      - name: Install node modules (locked)
        working-directory: app
        run: npm ci

      # Includes TraceReplayTest, the trace-replay gate over fixtures/synthetic and traces.
      - name: Unit tests
        working-directory: app/android
        run: ./gradlew test --console=plain

  node:
    name: lint, typecheck, test, API client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm test

      # Fails when contracts/openapi.yaml changed without regenerating the client.
      - name: Generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.ts

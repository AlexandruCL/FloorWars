name: server

on:
  pull_request:
    paths:
      - "server/**"
      - "contracts/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "contracts/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the uv image tag in server/Dockerfile.
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.13"

jobs:
  lint-test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: floorwars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floorwars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests (including the Alembic upgrade + `alembic check` test) run when this is
      # set and are skipped otherwise. Throwaway credentials for the service container only.
      FLOORWARS_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/floorwars
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major-version tag; pinned to the v10.3.0 commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Validate OpenAPI contract
        run: uvx --from openapi-spec-validator==0.9.0 openapi-spec-validator ../contracts/openapi.yaml

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest -q

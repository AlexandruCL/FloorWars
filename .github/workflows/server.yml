name: server

on:
  pull_request:
    paths:
      - "server/**"
      - "contracts/**"
      - "tools/qr/**"
      - "tools/seed/**"
      - "tools/conftest.py"
      - "infra/caddy/Dockerfile"
      - "infra/postgres/**"
      - ".trivyignore"
      - ".github/workflows/server.yml"
  # No path filter on main: deploy.sh pulls the image tagged with the deployed commit, so every
  # commit on main (including infra-only ones) needs its own image.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the uv image tag in server/Dockerfile.
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.13"

jobs:
  lint-test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: floorwars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floorwars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests (including the Alembic upgrade + `alembic check` test) run when this is
      # set and are skipped otherwise. Throwaway credentials for the service container only.
      FLOORWARS_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/floorwars
      # Auth tests (tests/auth) also need Valkey for the rate limits; the tests flush it.
      FLOORWARS_TEST_VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major-version tag; pinned to the v10.3.0 commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Validate OpenAPI contract
        run: uvx --from openapi-spec-validator==0.9.0 openapi-spec-validator ../contracts/openapi.yaml

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest -q

      # Needs `qrcode` in the dev dependency group (added by the auth branch).
      # The migration tests above downgrade to base when they finish, so migrate again for the seed.
      - name: Pytest (tools)
        env:
          FLOORWARS_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/floorwars
        run: |
          uv run alembic upgrade head
          uv run pytest -q ../tools/qr ../tools/seed

  image:
    name: build image
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase; the repository owner may not be.
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/floorwars-api" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trivy gate (plan 7.6): build the amd64 image into the local daemon (cached, so the real
      # build below reuses its layers), scan it, and only then build and push. A vulnerable image
      # never reaches GHCR. Fails on HIGH and CRITICAL findings that have a fix; findings without
      # one go into .trivyignore with a reason and a date.
      - name: Build amd64 image for the scan
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: floorwars-api:scan
          cache-from: type=gha,scope=floorwars-api
          cache-to: type=gha,mode=max,scope=floorwars-api

      # v0.36.0 (2026-04-22), pinned by commit; the tag is a movable reference.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: floorwars-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # Pull requests build both architectures without pushing; main pushes :<sha> and :main.
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=floorwars-api
          cache-to: type=gha,mode=max,scope=floorwars-api

  # Own Caddy (caddy-ratelimit) and Postgres (pgBackRest) images. amd64 only: the VM is amd64, and
  # xcaddy under qemu for arm64 would take far longer. Pull requests build without pushing; main
  # pushes :<sha> and :main. Compose runs :main (infra/docker-compose.yml).
  infra-image:
    name: build ${{ matrix.name }} image
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [caddy, postgres]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/floorwars-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No labels on purpose: the metadata-action labels change on every commit, and a changed
      # image id would make `docker compose up` recreate Postgres on every deploy.
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: infra/${{ matrix.name }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha,scope=floorwars-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=floorwars-${{ matrix.name }}

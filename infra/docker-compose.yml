# FloorWars production stack (plan 7.1 to 7.5). Week 1 scope: caddy, api (2 replicas),
# postgres + PostGIS, valkey. Run through infra/deploy.sh on the VM, which sets API_TAG and
# decrypts the secrets into SECRETS_DIR. Local run: see infra/README.md (compose.local.yml).
#
# Interpolation values come from the shell or infra/.env (non-secret only, see .env.example).
# Secrets are Compose file secrets: bind-mounted read-only files under /run/secrets in the
# container, never environment variables, so they do not show in `docker inspect`.

name: floorwars

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}" # Alloy turns attrs.tag into the Loki `container` label

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-}
      TEAM_IPS: ${TEAM_IPS:-}
    secrets:
      - grafana_basic_hash
    volumes:
      # The folder, not the file: a file mount keeps the old file after a checkout replaces it,
      # while deploy.sh reloads Caddy from this path.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data # certificates and ACME account: keep across deploys
      - caddy-config:/config
    networks:
      - edge
      - app
      - monitoring # reaches grafana
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/alexandrucl/floorwars-api}:${API_TAG:?set API_TAG to the git sha to run}
    restart: unless-stopped
    deploy:
      replicas: 2
    # No ports: only Caddy publishes. The healthcheck is the image's own HEALTHCHECK (/healthz).
    environment:
      FLOORWARS_ENV: ${FLOORWARS_ENV:-prod}
      FLOORWARS_LOG_LEVEL: ${FLOORWARS_LOG_LEVEL:-INFO}
      # uvicorn (proxy headers are on by default) takes the client IP from X-Forwarded-For only
      # when the TCP peer is in this list. Caddy is on the app network, whose subnet is fixed
      # below; per-IP rate limits would otherwise see Caddy's address for every user.
      FORWARDED_ALLOW_IPS: ${APP_SUBNET:-172.29.40.0/24}
      # Non-secret Week 2 settings, from infra/.env (see .env.example).
      FLOORWARS_MAIL_BACKEND: ${FLOORWARS_MAIL_BACKEND:-acs}
      FLOORWARS_ACS_ENDPOINT: ${FLOORWARS_ACS_ENDPOINT:-}
      FLOORWARS_MAIL_FROM: ${FLOORWARS_MAIL_FROM:-}
      FLOORWARS_ALLOWED_EMAIL_DOMAINS: ${FLOORWARS_ALLOWED_EMAIL_DOMAINS:-student.upt.ro}
    # pydantic-settings reads /run/secrets/<env prefix + field>, so targets carry the prefix.
    secrets:
      - source: database_url
        target: floorwars_database_url
      - source: valkey_url
        target: floorwars_valkey_url
      - source: jwt_signing_key
        target: floorwars_jwt_signing_key
      - source: qr_hmac_key
        target: floorwars_qr_hmac_key
      - source: acs_access_key
        target: floorwars_acs_access_key
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # One-off migrations (plan 7.7): `compose --profile tools run --rm migrate alembic upgrade head`.
  # Same image as api, but its floorwars_database_url is the migration role's URL (DDL rights).
  # Only on the data network: no internet, no published ports.
  migrate:
    image: ${API_IMAGE:-ghcr.io/alexandrucl/floorwars-api}:${API_TAG:?set API_TAG to the git sha to run}
    profiles: ["tools"]
    secrets:
      - source: migration_database_url
        target: floorwars_database_url
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: floorwars
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # PG 18 images keep PGDATA at /var/lib/postgresql/18/docker; mount the parent so a
    # future major upgrade (pg_upgrade --link) can live next to it. DATA_DIR is the
    # encrypted Azure data disk.
    volumes:
      - ${DATA_DIR:-/srv/floorwars/data}/postgres:/var/lib/postgresql
    shm_size: 256m
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d floorwars"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    # Roles: infra/sql/roles.sql creates floorwars_migrator (DDL) and floorwars_app (DML only).

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    user: "999:999" # valkey user in the image
    # The password goes into a config file on tmpfs, not into the command line or env.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf 'requirepass "%s"\n' "$$(cat /run/secrets/valkey_password)" > /tmp/valkey.conf &&
        exec valkey-server /tmp/valkey.conf --appendonly yes --dir /data
    secrets:
      - valkey_password
    volumes:
      - valkey-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Later weeks (placeholders only, not services yet):
  # worker:     Celery worker, same image as api, networks app + data (Week 2/4).
  # scheduler:  Celery beat (Week 4).
  # admin:      SQLAdmin, reachable only from team IPs through Caddy (Week 5).
  # backup:     pgBackRest to Azure Blob (Week 5, plan 7.7).

  # ---- Monitoring (plan 7.8, W5-6). Nothing here publishes a port; Grafana is reached through
  # Caddy (GRAFANA_DOMAIN, team IPs plus basic auth). Memory limits add up to about 1.6 GiB (measured use about 0.8 GiB), so
  # check `free -m` before enabling on the 4 GiB VM. To move grafana and loki to another PC see
  # infra/monitoring/README.md. Image tags: the newest at least 14 days old on the install day
  # (decision Q12b); looked up 2026-11-28, see README for the three that are still too new.
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver # Alloy's site probe
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring, app]
    deploy: {resources: {limits: {memory: 384m}}}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - discord_webhook_url
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring] # the only monitoring container that needs the internet (Discord)
    deploy: {resources: {limits: {memory: 64m}}}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.localhost}/
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]
    deploy: {resources: {limits: {memory: 384m}}} # measured 250 MiB under light load
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  loki:
    image: grafana/loki:3.7.10 # AGPL-3.0, used unmodified, not redistributed
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    deploy: {resources: {limits: {memory: 256m}}}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      PROBE_URL: ${PROBE_URL:-https://${DOMAIN:-localhost}/healthz}
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # json-file logs, no docker.sock
    networks: [monitoring, app] # app: the site probe goes through caddy's public name
    user: "0:0" # the log files are root-owned
    deploy: {resources: {limits: {memory: 192m}}}
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE] # root without it cannot write the volume or read the 0640 logs
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.13.1 # TOO NEW until 2026-12-03 (pushed 2026-11-19), see README
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile # W5-7 writes the backup timestamp here
    volumes:
      - /:/host:ro,rslave
      - backup-textfile:/textfile:ro
    networks: [monitoring]
    deploy: {resources: {limits: {memory: 48m}}}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1 # TOO NEW until 2026-12-02 (published 2026-11-18)
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    deploy: {resources: {limits: {memory: 256m}}} # measured 190 MiB
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1 # TOO NEW until 2026-12-02
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/floorwars?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_DB_USER:-floorwars_monitor} # role with pg_monitor only
      DATA_SOURCE_PASS_FILE: /run/secrets/exporter_db_password
    secrets:
      - exporter_db_password
    networks: [monitoring, data]
    depends_on:
      postgres:
        condition: service_healthy
    deploy: {resources: {limits: {memory: 64m}}}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  edge: {} # Caddy only; the one network with published ports
  app: # api (and later workers); outbound internet for e-mail. Fixed subnet: FORWARDED_ALLOW_IPS
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.29.40.0/24}
  data:
    internal: true # postgres and valkey: no route to the internet, no published ports
  monitoring: {} # prometheus, grafana, loki, alloy, exporters (W5-6)

volumes:
  caddy-data: {}
  caddy-config: {}
  valkey-data: {}
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
  loki-data: {}
  alloy-data: {}
  # backup-textfile: declared by the W5-7 branch (postgres writes /textfile/floorwars_backup.prom)

# Files written by deploy.sh (SOPS-decrypted, mode 0400) into SECRETS_DIR on tmpfs.
secrets:
  database_url:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/database_url
  valkey_url:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/valkey_url
  postgres_password:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/postgres_password
  valkey_password:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/valkey_password
  jwt_signing_key:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/jwt_signing_key
  qr_hmac_key:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/qr_hmac_key
  acs_access_key:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/acs_access_key
  migration_database_url:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/migration_database_url
  discord_webhook_url:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/discord_webhook_url
  grafana_admin_password:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/grafana_admin_password
  grafana_basic_hash:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/grafana_basic_hash
  exporter_db_password:
    file: ${SECRETS_DIR:-/run/secrets/floorwars}/exporter_db_password
